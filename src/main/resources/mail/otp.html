<!DOCTYPE html>
<html>
<body style="margin: 0; padding: 24px; background: #f7f7fb; font-family: Inter, Arial, sans-serif; color: #1f2937;">
    <div style="max-width: 520px; margin: 0 auto; background: #fff; border: 1px solid #ececf2; border-radius: 14px; padding: 28px;">
        <div style="font-size: 22px; font-weight: 700; color: #4f46e5; margin-bottom: 8px;">Mixpla</div>
        <h2 style="font-size: 20px; margin: 0 0 12px;">{title}</h2>
        <p style="margin: 0 0 18px; color: #4b5563; line-height: 1.45;">{subtitle}</p>
        <div style="margin: 16px 0 18px; background: #f3f4ff; border: 1px solid #dfe1ff; border-radius: 12px; text-align: center; padding: 18px;">
            <div style="font-size: 34px; letter-spacing: 6px; font-weight: 700; color: #312e81; font-family: 'Courier New', monospace;">{code}</div>
        </div>
        <p style="margin: 0; color: #6b7280; font-size: 14px; line-height: 1.45;">{note}</p>
        <div style="margin-top: 20px; padding-top: 16px; border-top: 1px solid #f0f0f5; color: #9ca3af; font-size: 12px;">Sent by Mixpla</div>
    </div>
</body>
</html>
